[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bleediff"
version = "0.6.0"
description = "Zero-dependency evaluation of adjacent-tenant context bleed via contrastive suppression against a clean baseline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
bleediff = "bleediff.cli:main"

[tool.setuptools]
packages = ["bleediff"]
